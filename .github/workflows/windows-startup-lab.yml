name: Isolated Windows startup lab

on:
  push:
    branches: [diagnosis/autonomous-startup]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-build:
    name: ${{ matrix.os }} / ${{ matrix.package }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-11-arm]
        package: [single, folder]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          path: lab
      - name: Check out the published source revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ matrix.package == 'single' && '14f8e8f22605e35464cac6d2cf614cbbccc57d68' || 'ade5f362abcab194e90678a15bd14f56c9bd29cf' }}
          path: source-revision
      - name: Install the original SDK version
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.401'
      - name: Rebuild without changing application source
        shell: pwsh
        env:
          PACKAGE_KIND: ${{ matrix.package }}
        run: ./lab/tools/startup-lab/Build-HostedRelease.ps1 -Package $env:PACKAGE_KIND -SourceDirectory ./source-revision
      - name: Exercise the rebuild with synthetic input
        shell: pwsh
        env:
          PACKAGE_KIND: ${{ matrix.package }}
        run: ./lab/tools/startup-lab/Test-HostedRelease.ps1 -Package $env:PACKAGE_KIND
      - name: Observe Windows startup dispatch with a separate control
        shell: pwsh
        env:
          PACKAGE_KIND: ${{ matrix.package }}
        run: ./lab/tools/startup-lab/Test-StartupDispatcher.ps1 -Package $env:PACKAGE_KIND
      - name: Retain only build metadata and the synthetic test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: startup-lab-${{ matrix.os }}-${{ matrix.package }}
          path: |
            ${{ runner.temp }}/startup-lab-report.json
            ${{ runner.temp }}/startup-lab-build.json
            ${{ runner.temp }}/startup-dispatch-report.json
          if-no-files-found: warn
          retention-days: 14
